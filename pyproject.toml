[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tssdmn"
version = "1.0.0"
description = "Tensor State Space-based Dynamic Multilayer Network Modeling"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "torch>=2.0",
    "scikit-learn>=1.2",
]

[tool.setuptools.packages.find]
include = ["tssdmn*"]
